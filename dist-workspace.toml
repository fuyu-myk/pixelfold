[workspace]
members = ["cargo:."]

# Config for 'dist'. Regenerate .github/workflows/release.yml with `dist generate`
# after changing anything here; that workflow is generated, not hand-edited.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The tap the generated Homebrew formula is pushed to. Needs a HOMEBREW_TAP_TOKEN
# secret on this repository with contents write access to the tap.
tap = "fuyu-myk/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). Each of these
# gets a native runner, aarch64 Linux included (ubuntu-22.04-arm), so nothing is
# cross-compiled: reqwest's rustls backend pulls in aws-lc-sys, which wants a C
# toolchain for the machine it is built on.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# On a pull request, only run the planning step: building every target on a PR is
# slow and the artifacts are discarded, but the plan still catches a broken
# release config before a tag goes out.
pr-run-mode = "plan"
# No self-updater binary alongside the tool.
install-updater = false

# The Linux binaries are built inside manylinux_2_28 (AlmaLinux 8, glibc 2.28)
# instead of directly on the Ubuntu 22.04 runners, so they link against glibc 2.28
# and start on RHEL/Rocky 8 cluster login nodes; built on the bare runner they
# needed GLIBC_2.34. Each container still runs on a runner of its own
# architecture, so the build stays native. `host` is the triple dist itself is
# installed as inside the container (musl, so its own glibc needs don't matter);
# the binaries are still built for the -gnu targets. The image tag is pinned:
# bump it deliberately.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64:2026.10.26-1", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-22.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64:2026.10.26-1", host = "aarch64-unknown-linux-musl" }

# dist's default runner for this target is macos-14, which GitHub retires on
# 2 November 2026 (actions/runner-images#13518). Pinned like the Linux runners.
[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-15"
