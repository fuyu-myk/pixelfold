# Pinned, not `stable`: a floating channel resolves to whatever each machine
# last installed, so a local toolchain can lag CI's and new lints first appear
# in CI. Everyone (and CI) builds, formats, and lints with this one version;
# bump it deliberately, together with the `dtolnay/rust-toolchain` refs in
# .github/workflows/ci.yml.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
