name: CI

on:
  push:
    branches: [master, main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deny warnings in first-party crates (registry deps are cap-lints allowed).
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test and clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all --check

  # The other jobs build with the pinned toolchain only, so nothing else notices
  # when the workspace stops compiling on its declared `rust-version`, which is
  # what `cargo install pixelfold` on an older cluster rustc needs. `+1.88`
  # overrides rust-toolchain.toml. Keep it in step with `rust-version` in
  # Cargo.toml.
  msrv:
    name: MSRV check (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo +1.88 check --workspace --locked

  validate:
    name: Validate (DSSP + SASA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # Downloaded structures persist across runs, keyed on the manifest.
      - name: Cache benchmark structures
        uses: actions/cache@v4
        with:
          path: benchmarks/cache
          key: benchmark-structures-${{ hashFiles('benchmarks/manifest.toml') }}
      - name: Detect golden references
        id: golden
        run: |
          if ls benchmarks/golden/*.dssp.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run validation harness
        if: steps.golden.outputs.present == 'true'
        run: cargo run -p pixelfold-validate -- --check
      - name: No golden references yet
        if: steps.golden.outputs.present != 'true'
        run: echo "No golden files committed yet; generate them with benchmarks/tools, then this job validates on every PR."
