[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/pixelfold-cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fuyu-myk/pixelfold"

[workspace.dependencies]
pixelfold-core = { path = "crates/pixelfold-core" }
pixelfold-render = { path = "crates/pixelfold-render" }
pixelfold-fetch = { path = "crates/pixelfold-fetch" }
pixelfold-tui = { path = "crates/pixelfold-tui" }

anyhow = "1.0.100"
bytes = "1.11.0"
crossterm = "0.29.0"
fixedbitset = "0.4.2"
flate2 = "1.1.8"
futures = "0.3.31"
glam = "0.30.9"
nom = "7.1.3"
nalgebra = { version = "0.33.2", features = ["serde-serialize"] }
pdbtbx = "0.12.0"
petgraph = "0.6"
ratatui = "0.29.0"
reqwest = { version = "0.13.1", features = ["json", "stream", "blocking"] }
rust-sasa = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net", "time"] }
tokio-stream = "0.1.18"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
