[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/pixelfold-cli"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fuyu-myk/pixelfold"
homepage = "https://github.com/fuyu-myk/pixelfold"
documentation = "https://docs.rs/pixelfold"
keywords = ["protein", "bioinformatics", "pdb", "structural-biology", "tui"]
categories = ["science", "command-line-utilities", "visualization"]
rust-version = "1.88"

[workspace.dependencies]
pixelfold-core = { path = "crates/pixelfold-core", version = "0.6.0" }
pixelfold-render = { path = "crates/pixelfold-render", version = "0.6.0" }
pixelfold-fetch = { path = "crates/pixelfold-fetch", version = "0.6.0" }
pixelfold-tui = { path = "crates/pixelfold-tui", version = "0.6.0" }

anyhow = "1.0.100"
bytes = "1.11.0"
crossterm = "0.29.0"
fixedbitset = "0.4.2"
flate2 = "1.1.8"
futures = "0.3.31"
glam = "0.30.9"
image = { version = "0.25.6", default-features = false, features = ["png"] }
nom = "7.1.3"
nalgebra = { version = "0.33.2", features = ["serde-serialize"] }
pdbtbx = "0.12.0"
png = "0.18"
petgraph = "0.6"
ratatui = "0.29.0"
ratatui-image = { version = "9.0.0", default-features = false, features = [
    "crossterm",
    "image-defaults",
] }
reqwest = { version = "0.13.1", features = ["json", "stream", "blocking"] }
rust-sasa = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net", "time"] }
tokio-stream = "0.1.18"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.pixelfold-core]
opt-level = 3

[profile.dev.package.pixelfold-render]
opt-level = 3
